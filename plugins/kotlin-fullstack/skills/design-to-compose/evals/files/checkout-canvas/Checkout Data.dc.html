<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body { margin: 0; font-family: system-ui, sans-serif; }</style></helmet>
<div style="width: 390px; height: 844px; background: #ffffff; padding: 24px; box-sizing: border-box;">
  <div style="font-size: 24px; font-weight: 700; color: {{accent}}">Checkout</div>
  <sc-for list="{{items}}" as="item"><div>{{item.label}}</div></sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#b45309"}}'>
class Component extends DCLogic { renderVals() { return { accent: '#b45309', items: [{label: 'One'}] } } }
</script>
</body>
</html>
